name: Gerar animação das contribuições

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar animação em SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#e62429&color_dots=#ebedf0,#9ecbff,#58a6ff,#2f81f7,#e62429
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff4b52&color_dots=#161b22,#183153,#1f4f8f,#2f81f7,#e62429

      - name: Publicar animação na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
