<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Letícia Félix — Desenvolvimento, Dados e Inteligência Artificial</title>
  <desc id="desc">Banner vermelho e azul-marinho com teias estilizadas e cidade, inspirado em quadrinhos de super-herói.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.52" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4b52"/>
      <stop offset="1" stop-color="#b30f21"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2979ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2979ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fff" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <path d="M0 0h410L245 360H0z" fill="url(#red)" opacity="0.96"/>
  <path d="M0 0h410L245 360H0z" fill="url(#dots)"/>

